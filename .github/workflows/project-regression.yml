name: Project regression

on:
  pull_request:
    paths:
      - '.github/workflows/project-regression.yml'
      - 'bench/**'
      - 'src/core/baseline.js'
      - 'src/core/caselock.js'
      - 'src/core/replay.js'
      - 'src/core/reproduce.js'
      - 'src/core/oracle.js'
      - 'src/core/snapshot.js'
  workflow_dispatch:

concurrency:
  group: projects-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  projects:
    name: ${{ matrix.case }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [it-tools-799, it-tools-1368]
    env:
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: Never
      BUGGPS_HOLDOUT_STATE: ${{ runner.temp }}/buggps-${{ matrix.case }}-state.json
      BUGGPS_HOLDOUT_OUT: ${{ runner.temp }}/buggps-${{ matrix.case }}-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the pinned project
        run: node bench/setup-holdout.mjs "${{ matrix.case }}"
      - name: Run the complete case controls
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: node bench/holdout.mjs "${{ matrix.case }}"
      - name: Retain structured case records
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-${{ matrix.case }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.BUGGPS_HOLDOUT_OUT }}/*.json
          if-no-files-found: warn
          retention-days: 7
